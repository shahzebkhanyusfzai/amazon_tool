<!-- templates/index.html -->
{% extends "base.html" %}
{% block content %}
<!-- We'll override the .home-page layout to stack vertically -->
<div class="container home-page">
  
  <!-- ASIN Analysis Box -->
  <div class="asin-input-container">
    <h3>Enter ASIN for listing analysis</h3>
    <form action="{{ url_for('analyze') }}" method="POST">
      <input type="text" name="asin" placeholder="e.g. B007JXVR76" class="asin-input">
      <button type="submit" class="deep-dive-btn">Deep Dive</button>
    </form>
  </div>

  <!-- UPC Bulk Analysis Box -->
  <div class="upc-input-container">
    <h3>Enter UPC(s) for bulk analysis</h3>
    <form action="{{ url_for('bulk_analysis') }}" method="POST">
      <input type="text" name="upc" placeholder="e.g. 012345678901, 098765432109..." class="upc-input">
      <button type="submit" class="bulk-analysis-btn">Bulk Analysis</button>
    </form>
  </div>

  <!-- MY SUPPLIERS BOX or BUTTON -->
  <div class="suppliers-box">
    <h3>Manage Your Suppliers</h3>
    <button class="bulk-analysis-btn" id="mySuppliersBtn">
      My Suppliers
    </button>
    
    <script>
      document.getElementById("mySuppliersBtn").addEventListener("click", function() {
        window.location.href = "{{ url_for('my_suppliers') }}";
      });
    </script>
    

  </div>



</div>
{% endblock %}
