{% extends "base.html" %}
{% block content %}
<div class="container">
  <h2>Add New Supplier</h2>
  <form id="addSupplierForm" onsubmit="return false;" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label for="supplierName">Name</label><br>
      <input type="text" id="supplierName" placeholder="Enter Supplier Name" required>
    </div>
    <div>
      <label for="inboundShippingPerLb">Inbound Shipping - Add Price Per LB ($)</label><br>
      <input type="number" step="0.01" id="inboundShippingPerLb" placeholder="0.00">
    </div>
    <div>
      <label for="inboundShippingPercent">Inbound Shipping - Add % To Cost Price</label><br>
      <input type="number" step="0.01" id="inboundShippingPercent" placeholder="0">
    </div>
    <div>
      <label for="csvFile">Upload CSV</label><br>
      <input 
      type="file"
      id="csvFile"
      accept=".csv, .xlsx, .xls, 
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, 
      application/vnd.ms-excel">
    
      <p style="font-size:0.9rem; color: #bbb;">
        Please make sure the first column contains the UPC and the second column contains the Price.
      </p>
    </div>
    <!-- <button class="bulk-analysis-btn" onclick="saveSupplier()">Save Supplier</button> -->
    <button 
      type="button"
      class="bulk-analysis-btn"
      onclick="saveSupplier()">
      Save Supplier
    </button>
  
  </form>
  <!-- Add somewhere in add_supplier.html, e.g. below the form -->
    <div id="uploadSpinner" style="display:none; margin-top: 1rem; text-align: center;">
        <img src="/static/img/spinner.gif" alt="Loading..." style="width:48px; height:auto;" />

        <p style="font-size:0.9rem; color: #bbb;">
            Please upload a CSV file. The first column must contain the UPC, the second column the Price.
        </p>
          
    </div>
  
</div>

<!-- Link our new JS file to handle form + localStorage saving -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="{{ url_for('static', filename='js/add_supplier.js') }}"></script>
{% endblock %}
