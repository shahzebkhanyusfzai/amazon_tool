<!-- templates/supplier_details.html -->
{% extends "base.html" %}
{% block content %}
<div class="container" id="supplier-details-container">
  <h2>Supplier UPCs</h2>

  <!-- Pagination controls -->
  <div style="margin-bottom: 1rem;">
    <button class="bulk-analysis-btn" onclick="prevPage()">Prev</button>
    <span id="pageInfo"></span>
    <button class="bulk-analysis-btn" onclick="nextPage()">Next</button>
  </div>

  <table class="bulk-results-table">
    <thead>
      <tr>
        <th>Banana</th>
        <th>Title / ASIN / UPC / Reviews</th>
        <th>Lowest Price: (30d / 90d)</th>
        <th>Profitability</th>
        <th>Sales Rank</th>
        <th>Estimated Sales</th>
        <th>Inventory<br>(QTY / Days)</th>
        <th>Bought in Past Month</th>
        <th># Sellers</th>
        <th>Sold By Amazon</th>
      </tr>
    </thead>
    <tbody id="supplierDetailTableBody">
    </tbody>
  </table>
</div>



<!-- The existing Profit Calculator modal -->
<div id="profitModal" class="profit-modal" style="display:none;">
  <div class="profit-modal-content">
    <span id="closeModal" class="modal-close">&times;</span>
    <h3>Profit Calculator</h3>
    
    <!-- Add fields for costOfGoods, shippingPerLb, shippingPct, and SellPrice -->
    <div class="profit-calc-row">
      <label for="modalSellPrice">Sell Price ($):</label>
      <input 
        type="number" 
        step="0.01" 
        id="modalSellPrice" 
        value="0" 
      />
    </div>
    
    <div class="profit-calc-row">
      <label for="modalCostOfGoods">Cost of Goods ($):</label>
      <input 
        type="number" 
        step="0.01" 
        id="modalCostOfGoods" 
        value="0" 
      />
    </div>
    
    <div class="profit-calc-row">
      <label for="modalShippingPerLb">Inbound Shipping Per LB ($):</label>
      <input 
        type="number" 
        step="0.01" 
        id="modalShippingPerLb" 
        value="0" 
      />
    </div>
    
    <div class="profit-calc-row">
      <label for="modalShippingPct">Inbound Shipping % of Cost:</label>
      <input 
        type="number" 
        step="0.01" 
        id="modalShippingPct" 
        value="0"
      />
    </div>
    

    <button id="recalcBtn" class="bulk-analysis-btn">Recalculate</button>
    
    <div id="profitResultArea" style="margin-top:1rem;">
      <!-- We'll fill in "Profit: X" and "ROI: Y%" here -->
    </div>
  </div>
</div>





<!-- The JS code that populates the table -->
<script src="{{ url_for('static', filename='js/supplier_details.js') }}"></script>
{% endblock %}
